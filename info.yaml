project:
  title:        "K-Means Clustering AI/ML Accelerator"
  author:       "Niyaz"
  description:  "Pipelined hardware engine computing Euclidean distance clustering"
  language:     "Verilog"
  clock_hz:     50000000       # 50 MHz

  # Our design has ~2,500 gates, so 1x2 tiles (167x216 um) provides ideal routing density
  tiles: "1x2"

  top_module:  "tt_um_niyajuban_kmeans"

  source_files:
    - "project.v"
    - "pe.sv"
    - "dist_unit.sv"
    - "kmeans_top.sv"

pinout:
  # Inputs: Point X coordinate
  ui[0]: "px[0]"
  ui[1]: "px[1]"
  ui[2]: "px[2]"
  ui[3]: "px[3]"
  ui[4]: "px[4]"
  ui[5]: "px[5]"
  ui[6]: "px[6]"
  ui[7]: "px[7]"

  # Outputs
  uo[0]: "cluster_out (0=C0, 1=C1)"
  uo[1]: "valid_out"
  uo[2]: "dist0_lsb[0]"
  uo[3]: "dist0_lsb[1]"
  uo[4]: "dist0_lsb[2]"
  uo[5]: "dist0_lsb[3]"
  uo[6]: "dist0_lsb[4]"
  uo[7]: "dist0_lsb[5]"

  # Inputs: Point Y coordinate
  uio[0]: "py[0]"
  uio[1]: "py[1]"
  uio[2]: "py[2]"
  uio[3]: "py[3]"
  uio[4]: "py[4]"
  uio[5]: "py[5]"
  uio[6]: "py[6]"
  uio[7]: "py[7]"

yaml_version: 6
